<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171b20"><title>永夜：新境界｜可遊玩原型</title>
<style>
:root{color-scheme:dark;--gold:#e8c477;--panel:#20262d;--line:#66563b;--green:#65d68a;--red:#ed6d6d;--blue:#65c8ed}
*{box-sizing:border-box}body{margin:0;background:#111519;color:#f4ead6;font:14px system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow:hidden}button,select{font:inherit;color:inherit;background:#303942;border:1px solid #776443;border-radius:8px;padding:9px 11px;touch-action:manipulation}button:active{transform:translateY(1px);filter:brightness(1.2)}button.primary{background:#755a2e;border-color:#d9b66b}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1400px;margin:auto;background:#171c21}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:linear-gradient(#34302a,#1f2429);border-bottom:1px solid var(--line)}.brand{font-weight:900;color:var(--gold);letter-spacing:1px}.stat{min-width:95px;flex:1}.stat small{display:flex;justify-content:space-between;color:#d9d0bd;margin-bottom:4px}.bar{height:9px;background:#0c0e10;border:1px solid #5c5547;border-radius:99px;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#9e272b,#ef6464)}.mp{background:linear-gradient(90deg,#2364a5,#67c8f4)}.xp{background:linear-gradient(90deg,#9a742a,#f4d27a)}#stage{position:relative;min-height:0;overflow:hidden;background:#18271f}canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}.overlay{position:absolute;inset:10px 10px auto 10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.tag{background:#101613d9;border:1px solid #5b654c;border-radius:8px;padding:7px 10px;box-shadow:0 2px 8px #0005}.tag b{color:var(--gold)}#toast{position:absolute;left:50%;top:55px;transform:translateX(-50%);background:#141719ee;border:1px solid #bca064;border-radius:9px;padding:9px 14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#toast.show{opacity:1}.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px;background:#1b2025;border-top:1px solid var(--line)}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.skill{min-width:56px;min-height:54px;display:grid;place-items:center;gap:2px;background:linear-gradient(#39414a,#242a30)}.skill span{font-size:20px}.skill small{font-size:10px;color:#d8c99d}.right{display:flex;gap:7px;align-items:center}.joystick{width:112px;height:112px;border:2px solid #d8c99d88;border-radius:50%;background:#101820aa;position:relative;touch-action:none;display:none;flex-shrink:0}.knob{position:absolute;width:42px;height:42px;left:33px;top:33px;border-radius:50%;background:#e8c477aa;border:2px solid #ffe2a3;pointer-events:none}.modal{position:absolute;inset:0;background:#0009;display:none;place-items:center;padding:16px}.modal.open{display:grid}.sheet{width:min(460px,100%);max-height:80%;overflow:auto;background:#20262d;border:1px solid #b99a59;border-radius:14px;padding:16px;box-shadow:0 15px 50px #000a}.sheet h2{margin:0 0 12px;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{min-height:75px;border:1px solid #66563b;background:#171c20;border-radius:8px;padding:8px}.muted{color:#b8b09e;font-size:12px}.footerline{display:flex;justify-content:space-between;gap:8px;align-items:center}.mobilehint{color:#b9b19f;font-size:11px}@media(max-width:680px){.top{gap:7px;padding:7px}.brand{width:100%}.stat{min-width:70px}.bottom{grid-template-columns:1fr;padding:7px;gap:7px}.actions{justify-content:space-between}.skill{flex:1;min-width:48px;min-height:49px;padding:5px}.right{justify-content:space-between}.joystick{display:block}.mobilehint{max-width:135px}button{padding:8px}.top button{padding:7px;font-size:12px}}@media(min-width:681px){.joystick{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="top">
<div class="brand">⚔ 永夜：新境界 <span class="muted">ALPHA · 單機原型</span></div>
<div class="stat"><small><span id="hptext">HP 100/100</span><span>生命</span></small><div class="bar"><div id="hpbar" class="fill hp"></div></div></div>
<div class="stat"><small><span id="mptext">MP 60/60</span><span>魔力</span></small><div class="bar"><div id="mpbar" class="fill mp"></div></div></div>
<div class="stat"><small><span id="xptext">Lv. 1 · EXP 0%</span><span>經驗</span></small><div class="bar"><div id="xpbar" class="fill xp"></div></div></div>
<select id="classSelect" aria-label="選擇職業"><option>騎士</option><option>王族</option><option>妖精</option><option>法師</option><option>黑暗妖精</option></select>
</header>
<main id="stage">
<canvas id="game" aria-label="可操作的斜角地圖"></canvas>
<div class="overlay"><div class="tag">📍 <b id="mapname">銀月森林</b><br><span class="muted">點擊地面移動 · 點怪物鎖定</span></div><div class="tag">🗡 <b id="targetname">尚未選取目標</b><br><span id="statusline" class="muted">探索中</span></div></div>
<div id="toast"></div>
<div class="modal" id="modal"><section class="sheet"><div class="footerline"><h2 id="modalTitle">角色背包</h2><button id="closeModal">關閉 ✕</button></div><div id="modalBody"></div></section></div>
</main>
<footer class="bottom">
<div class="actions">
<button id="attack" class="primary skill"><span>⚔️</span><small>普通攻擊</small></button>
<button id="fire" class="skill"><span>🔥</span><small>火焰箭 · 8MP</small></button>
<button id="heal" class="skill"><span>💚</span><small>治癒術 · 10MP</small></button>
<button id="bag" class="skill"><span>🎒</span><small>背包</small></button>
<button id="map" class="skill"><span>🗺️</span><small>切換地圖</small></button>
</div>
<div class="right"><div class="joystick" id="joy" aria-label="虛擬搖桿"><div class="knob" id="knob"></div></div><div class="mobilehint">移動：點地面／搖桿／WASD 或方向鍵<br>攻擊：選擇怪物後按攻擊</div></div>
</footer>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
const classes={'騎士':{hp:120,mp:40,color:'#c5d7e2',damage:13,spell:1},'王族':{hp:105,mp:55,color:'#f1c36c',damage:10,spell:1.1},'妖精':{hp:90,mp:75,color:'#8be0a3',damage:9,spell:1.25},'法師':{hp:80,mp:100,color:'#91b8ff',damage:7,spell:1.6},'黑暗妖精':{hp:95,mp:65,color:'#c5a1eb',damage:12,spell:1.2}};
const maps=[{name:'銀月森林',ground:'#335b3b',accent:'#4e7546',mobs:['森林史萊姆','骷髏兵','野狼']},{name:'古代地牢',ground:'#4c4b43',accent:'#68604f',mobs:['地牢骷髏','黑蝙蝠','石像鬼']},{name:'晨曦村莊',ground:'#526747',accent:'#8a794d',mobs:['訓練木人','小史萊姆']}];
let mapIndex=0,player={x:0,y:0,hp:100,mp:60,xp:0,level:1,gold:0,dir:0,walk:0,attackAnim:0,spellAnim:0},charName='騎士',cfg=classes[charName],target=null,loot=[],effects=[],keys={},last=0,move={x:0,y:0},path=null,spawnId=0,inventory=[{name:'紅色藥水',icon:'🧪',count:3},{name:'森林草藥',icon:'🌿',count:1}],mobs=[];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);canvas._w=r.width;canvas._h=r.height}
function spawn(n=7){mobs=[];for(let i=0;i<n;i++){let x=rand(-320,320),y=rand(-240,240);mobs.push({id:++spawnId,name:maps[mapIndex].mobs[i%maps[mapIndex].mobs.length],x,y,hp:rand(26,42),max:40,attack:rand(3,7),speed:rand(13,22),phase:rand(0,6),cool:rand(.5,2),alive:true})}}
function iso(x,y){return{x:(x-y)*.78,y:(x+y)*.39}}
function project(x,y){const p=iso(x-player.x,y-player.y);return{x:canvas._w/2+p.x,y:canvas._h/2+p.y+20}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function hud(){player.hp=clamp(player.hp,0,cfg.hp);player.mp=clamp(player.mp,0,cfg.mp);$('hptext').textContent='HP '+Math.ceil(player.hp)+'/'+cfg.hp;$('mptext').textContent='MP '+Math.ceil(player.mp)+'/'+cfg.mp;$('hpbar').style.width=player.hp/cfg.hp*100+'%';$('mpbar').style.width=player.mp/cfg.mp*100+'%';$('xptext').textContent='Lv. '+player.level+' · EXP '+Math.floor(player.xp%100)+'%';$('xpbar').style.width=player.xp%100+'%';$('targetname').textContent=target&&target.alive?target.name+' · HP '+Math.ceil(target.hp)+'/'+target.max:'尚未選取目標';$('mapname').textContent=maps[mapIndex].name}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawGround(){const w=canvas._w,h=canvas._h;ctx.fillStyle=maps[mapIndex].ground;ctx.fillRect(0,0,w,h);const size=44,origin=project(0,0);for(let x=-14;x<15;x++)for(let y=-14;y<15;y++){const p=project(x*size,y*size);if(p.x<-60||p.x>w+60||p.y<-40||p.y>h+40)continue;ctx.beginPath();ctx.moveTo(p.x,p.y-size*.39);ctx.lineTo(p.x+size*.78,p.y);ctx.lineTo(p.x,p.y+size*.39);ctx.lineTo(p.x-size*.78,p.y);ctx.closePath();ctx.fillStyle=((x+y)%2===0)?maps[mapIndex].accent:maps[mapIndex].ground;ctx.fill();ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;ctx.stroke()}
for(let i=0;i<17;i++){let x=Math.sin(i*21.8)*390,y=Math.cos(i*13.7)*290,p=project(x,y);if(p.x<0||p.x>w||p.y<0||p.y>h)continue;drawTree(p.x,p.y)}}
function drawTree(x,y){ctx.fillStyle='#17251b';ctx.beginPath();ctx.ellipse(x,y+8,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6c4930';ctx.fillRect(x-3,y-18,6,23);for(let i=0;i<3;i++){ctx.fillStyle=['#1b4931','#27633b','#367449'][i];ctx.beginPath();ctx.moveTo(x,y-49+i*10);ctx.lineTo(x-19+i*3,y-15+i*8);ctx.lineTo(x+19-i*3,y-15+i*8);ctx.closePath();ctx.fill()}}
function drawMob(m){const p=project(m.x,m.y);if(p.x<-50||p.x>canvas._w+50||p.y<-50||p.y>canvas._h+50)return;ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(p.x,p.y+7,13,5,0,0,Math.PI*2);ctx.fill();const slime=m.name.includes('史萊姆')||m.name.includes('木人');if(slime){ctx.fillStyle=m.name.includes('木人')?'#92704b':'#73d98a';ctx.beginPath();ctx.ellipse(p.x,p.y-5,13,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a2b21';ctx.fillRect(p.x-5,p.y-8,3,3);ctx.fillRect(p.x+3,p.y-8,3,3)}else{ctx.fillStyle=m.name.includes('狼')?'#9c9c9b':m.name.includes('蝙蝠')?'#655a86':'#d1d0c5';ctx.fillRect(p.x-8,p.y-19,16,23);ctx.fillStyle='#a23d37';ctx.fillRect(p.x-5,p.y-15,3,3);ctx.fillRect(p.x+3,p.y-15,3,3);ctx.fillStyle='#d8d0bb';ctx.fillRect(p.x-11,p.y-10,4,10);ctx.fillRect(p.x+7,p.y-10,4,10)}if(target===m){ctx.strokeStyle='#ffe28b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y+7,17,6,0,0,Math.PI*2);ctx.stroke()}rounded(p.x-17,p.y-31,34,4,2,'#181b1b');rounded(p.x-16,p.y-30,32*clamp(m.hp/m.max,0,1),2,1,'#db5b58');ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff1cf';ctx.fillText(m.name,p.x,p.y-35)}
function drawPlayer(){const p=project(0,0),walking=player.walk>0;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(p.x,p.y+8,13,5,0,0,Math.PI*2);ctx.fill();const bob=walking?Math.sin(player.walk*12)*2:0;ctx.fillStyle='#c9b69a';ctx.fillRect(p.x-5,p.y-27+bob,10,9);ctx.fillStyle=cfg.color;ctx.fillRect(p.x-8,p.y-18+bob,16,18);ctx.fillStyle='#5e4634';ctx.fillRect(p.x-7,p.y-1+bob,5,9);ctx.fillRect(p.x+2,p.y-1-bob,5,9);ctx.fillStyle='#f4d18a';ctx.fillRect(p.x-4,p.y-24+bob,2,2);if(player.attackAnim>0){ctx.strokeStyle='#fff0a4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x+10,p.y-8,player.attackAnim*23,Math.PI*1.1,Math.PI*1.8);ctx.stroke()}if(player.spellAnim>0){ctx.strokeStyle='#83d9ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y-13,12+(1-player.spellAnim)*24,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#fff0d0';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(charName+' Lv.'+player.level,p.x,p.y-36)}
function drawEffects(dt){for(const e of effects){e.t-=dt;const p=project(e.x,e.y);ctx.globalAlpha=clamp(e.t/e.life,0,1);if(e.kind==='text'){ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillStyle=e.color;ctx.fillText(e.text,p.x,p.y-20-(1-e.t/e.life)*22)}else{ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y-8,(1-e.t/e.life)*25+3,0,Math.PI*2);ctx.stroke()}}ctx.globalAlpha=1;effects=effects.filter(e=>e.t>0)}
function effect(x,y,kind,text,color){effects.push({x,y,kind,text,color,t:kind==='text'?.85:.38,life:kind==='text'?.85:.38})}
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw(dt);requestAnimationFrame(frame)}
function update(dt){let dx=move.x,dy=move.y;if(keys.w||keys.ArrowUp)dy-=1;if(keys.s||keys.ArrowDown)dy+=1;if(keys.a||keys.ArrowLeft)dx-=1;if(keys.d||keys.ArrowRight)dx+=1;if(dx||dy){const n=Math.hypot(dx,dy)||1;player.x+=dx/n*95*dt;player.y+=dy/n*95*dt;player.walk+=dt;path=null}else if(path){let vx=path.x-player.x,vy=path.y-player.y,d=Math.hypot(vx,vy);if(d<5)path=null;else{player.x+=vx/d*Math.min(95*dt,d);player.y+=vy/d*Math.min(95*dt,d);player.walk+=dt}}
player.attackAnim=Math.max(0,player.attackAnim-dt*2.8);player.spellAnim=Math.max(0,player.spellAnim-dt*1.8);
for(const m of mobs){if(!m.alive)continue;m.cool-=dt;const d=Math.hypot(player.x-m.x,player.y-m.y);if(d<190){if(d>31){m.x+=(player.x-m.x)/d*m.speed*dt;m.y+=(player.y-m.y)/d*m.speed*dt}else if(m.cool<=0){m.cool=1.65;player.hp-=m.attack;effect(0,0,'text','-'+Math.ceil(m.attack),'#ff7373');effect(0,0,'ring','','#e65c5c');if(player.hp<=0){player.hp=cfg.hp;player.mp=cfg.mp;player.x=0;player.y=0;toast('你被擊倒了，已返回安全區')}}}}
hud()}
function draw(){drawGround();for(const m of mobs)if(m.alive)drawMob(m);for(const l of loot){const p=project(l.x,l.y);ctx.fillStyle='#ffd777';ctx.fillRect(p.x-4,p.y-5,8,8);ctx.fillStyle='#fff0c3';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(l.name,p.x,p.y-9)}drawPlayer();drawEffects()}
function nearestAt(px,py){let best=null,bd=42;for(const m of mobs){if(!m.alive)continue;const p=project(m.x,m.y),d=Math.hypot(px-p.x,py-p.y);if(d<bd){best=m;bd=d}}return best}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,m=nearestAt(x,y);if(m){target=m;path=null;$('statusline').textContent='目標已鎖定';toast('已鎖定 '+m.name)}else{const wx=(x-canvas._w/2)/.78,wy=(y-canvas._h/2-20)/.39;path={x:player.x+(wx+wy)/2,y:player.y+(wy-wx)/2};target=null;$('statusline').textContent='移動中'}})
function attack(){if(!target||!target.alive){toast('請先點選一隻怪物');return}if(Math.hypot(target.x-player.x,target.y-player.y)>55){path={x:target.x,y:target.y};toast('靠近目標中…');return}const dmg=Math.max(2,Math.round(cfg.damage*rand(.8,1.25)));target.hp-=dmg;player.attackAnim=1;effect(target.x,target.y,'text','-'+dmg,'#ffe28b');effect(target.x,target.y,'ring','','#f7d16e');if(target.hp<=0)kill(target)}
function cast(kind){if(kind==='heal'){if(player.mp<10){toast('魔力不足');return}player.mp-=10;const val=Math.round(20*cfg.spell);player.hp=Math.min(cfg.hp,player.hp+val);player.spellAnim=1;effect(0,0,'text','+'+val,'#72f0a2');effect(0,0,'ring','','#72f0a2');toast('治癒術恢復 '+val+' HP');hud();return}if(player.mp<8){toast('魔力不足');return}if(!target||!target.alive){toast('請先選擇魔法目標');return}player.mp-=8;player.spellAnim=1;const dmg=Math.round(rand(15,23)*cfg.spell);effect(target.x,target.y,'ring','','#6dd7ff');effect(target.x,target.y,'text','-'+dmg,'#87e4ff');target.hp-=dmg;toast('火焰箭命中！');if(target.hp<=0)kill(target);hud()}
function kill(m){m.alive=false;player.xp+=22;player.gold+=Math.round(rand(4,13));loot.push({x:m.x,y:m.y,name:Math.random()<.6?'金幣':'草藥'});effect(m.x,m.y,'text','擊殺！','#ffe28b');toast('擊敗 '+m.name+'！獲得經驗與金幣');if(player.xp>=100){player.xp-=100;player.level++;cfg=classes[charName];player.hp=Math.min(cfg.hp,player.hp+15);player.mp=Math.min(cfg.mp,player.mp+10);toast('升級！目前 Lv.'+player.level)}target=null;setTimeout(()=>{if(!m.alive){const i=mobs.indexOf(m);if(i>=0)mobs[i]={id:++spawnId,name:maps[mapIndex].mobs[Math.floor(Math.random()*maps[mapIndex].mobs.length)],x:rand(-300,300),y:rand(-220,220),hp:40,max:40,attack:rand(3,7),speed:rand(13,22),phase:0,cool:1,alive:true}}},1200)}
$('attack').onclick=attack;$('fire').onclick=()=>cast('fire');$('heal').onclick=()=>cast('heal');
$('classSelect').onchange=e=>{charName=e.target.value;cfg=classes[charName];player.hp=Math.min(player.hp,cfg.hp);player.mp=Math.min(player.mp,cfg.mp);toast('職業已切換：'+charName);hud()};
$('map').onclick=()=>{mapIndex=(mapIndex+1)%maps.length;player.x=0;player.y=0;target=null;loot=[];spawn(mapIndex===2?4:7);hud();toast('已前往 '+maps[mapIndex].name)};
$('bag').onclick=()=>{ $('modalTitle').textContent='🎒 背包與角色';$('modalBody').innerHTML='<p>金幣：<b style="color:#e8c477">'+player.gold+'</b>　等級：'+player.level+'</p><div class="grid">'+inventory.map((it,i)=>'<div class="slot"><div style="font-size:23px">'+it.icon+'</div><b>'+it.name+'</b><div class="muted">數量：'+it.count+'</div></div>').join('')+'<div class="slot"><div style="font-size:23px">🪙</div><b>金幣</b><div class="muted">數量：'+player.gold+'</div></div></div><p class="muted">原型版：背包目前為本次遊玩暫存，尚未接入帳號或雲端存檔。</p>';$('modal').classList.add('open')};
$('closeModal').onclick=()=> $('modal').classList.remove('open');$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keys[k]=true;if(k===' ' )attack();if(k==='1')cast('fire');if(k==='2')cast('heal')});window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
