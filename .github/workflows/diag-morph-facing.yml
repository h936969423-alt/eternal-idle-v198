name: Diag morph facing (temporary)
on:
  push:
    branches: [diag/morph-facing]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore game assets from isolated private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/restore-r2-bundles.py
      - name: Export attack frames only
        run: |
          mkdir -p /tmp/out
          cd public/assets
          for d in morphanim/*/attack morphanim/*/idle sprites/deathknight/attack sprites/darkelf/attack; do [ -d "$d" ] && mkdir -p "/tmp/out/$d" && cp "$d"/*.png "/tmp/out/$d/"; done
          ls polymorph-cast >/tmp/out/polymorph-cast-ls.txt 2>&1 || true
          find polymorph-cast -name 'attack_*.png' | head -2000 > /tmp/out/polymorph-cast-attack.txt || true
          du -sh /tmp/out
      - name: Push to output branch
        run: |
          cd /tmp/out
          git init -q -b diag/morph-facing-out
          git config user.email actions@github.com; git config user.name actions
          git add -A; git commit -q -m "morph attack frames export"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/morph-facing-out
