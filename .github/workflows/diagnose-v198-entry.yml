name: Diagnose v198 character-entry errors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-v198-entry.yml]
permissions:
  contents: read
concurrency:
  group: v198-entry-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: 9bf17726da5739f20d3e5ec454ae3d91
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned diagnostic CLI
        run: npm install --prefix /tmp/v198-diagnostic wrangler@4.92.0 --no-audit --no-fund
      - name: Read configured resource limits only
        run: |
          curl --silent --show-error --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/eternal-idle-v198-test/settings" -o /tmp/v198-settings.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v198-settings.json'))
          print(json.dumps({'settingsSuccess':d.get('success'),'limits':d.get('result',{}).get('limits'),'usageModel':d.get('result',{}).get('usage_model'),'observability':d.get('result',{}).get('observability')}))
          PY
      - name: Query retained test Worker errors without printing request data
        run: |
          python3 - <<'PYH'
          import os,json,time,urllib.request,urllib.error
          end=int(time.time()*1000)
          payload={'queryId':'v198-entry-history','timeframe':{'from':end-3600000,'to':end},'limit':200,'dry':True,'view':'events','parameters':{'needle':{'value':'/api/game'},'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'eternal-idle-v198-test'}]}}
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/observability/telemetry/query'
          request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
          except urllib.error.HTTPError as error:
              print('HISTORY_HTTP_STATUS='+str(error.code))
              try:print(json.dumps(json.load(error).get('errors',[])))
              except Exception:pass
              raise SystemExit(0)
          print('HISTORY_SUCCESS='+str(data.get('success')))
          print('HISTORY_ERRORS='+json.dumps(data.get('errors',[])))
          count=0
          def inspect(obj):
              global count
              if isinstance(obj,dict):
                  if '$metadata' in obj:
                      meta=obj.get('$metadata') or {};worker=obj.get('$workers') or {};event=worker.get('event') or {};response=event.get('response') or {}
                      print(json.dumps({'timestamp':obj.get('timestamp'),'level':meta.get('level'),'type':meta.get('type'),'error':str(meta.get('error',''))[:500],'message':str(meta.get('message',''))[:500],'outcome':worker.get('outcome'),'status':response.get('status'),'cpuTimeMs':worker.get('cpuTimeMs'),'wallTimeMs':worker.get('wallTimeMs')},ensure_ascii=False))
                      count+=1
                  else:
                      for value in obj.values():inspect(value)
              elif isinstance(obj,list):
                  for value in obj:inspect(value)
          result=data.get('result',{});print('HISTORY_RESULT_SHAPE='+json.dumps({k:({'type':type(v).__name__,'count':len(v) if hasattr(v,'__len__') else None,'keys':list(v)[:15] if isinstance(v,dict) else None}) for k,v in result.items()}));inspect(result);print('HISTORY_EVENTS='+str(count))
          PYH
