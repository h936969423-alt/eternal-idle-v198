name: Inspect client map assets
# Data-only inspection. No secrets, read-only token. The archive is
# listed and matching data files are extracted; nothing inside it is executed.
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: Google Drive file id of the client archive
        required: false
        default: ''
        type: string
      include_patterns:
        description: Space-separated archive patterns to extract
        required: false
        default: '*.s32 *.seg *.til *.idx *.pak *.md map/* maps/* tile/* tiles/* Map/* Maps/* Tile/* Tiles/*'
        type: string
      upload_extracted:
        description: Upload extracted files as a 3-day artifact (off lists only)
        required: false
        default: false
        type: boolean
      parse_maps:
        description: Parse S32 and index files and print the result to the log
        required: false
        default: false
        type: boolean
      build_bundle:
        description: Build map data bundle and previews
        required: false
        default: false
        type: boolean
      upload_r2:
        description: Upload the verified bundle to isolated private R2
        required: false
        default: false
        type: boolean
      render_preview:
        description: Render preview regions and upload them to isolated private R2
        required: false
        default: false
        type: boolean
      check_site:
        description: Only check deployed preview assets on the test site
        required: false
        default: false
        type: boolean
      sprite_probe:
        description: Probe player walk sprites and print results to the log
        required: false
        default: false
        type: boolean
      render_walk:
        description: Render player walk frames and upload them to isolated private R2
        required: false
        default: false
        type: boolean
      scan_monsters:
        description: Match remaining monsters against every client sprite and upload walk sheets to private R2
        required: false
        default: false
        type: boolean
      render_world:
        description: Render world zones from the private R2 map source and upload them
        required: false
        default: false
        type: boolean
      render_attack:
        description: Render 8-direction player attacks and upload them to isolated private R2
        required: false
        default: false
        type: boolean
      browser_zone:
        description: Play this zone in a phone browser with a new QA account (blank skips)
        required: false
        default: ''
        type: string
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
      INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.browser_zone != '' }}
        with:
          persist-credentials: false
      - name: Play the test site in a phone browser
        if: ${{ inputs.browser_zone != '' }}
        env:
          WORLD_ZONE: ${{ inputs.browser_zone }}
        run: |
          npm init -y >/dev/null
          npm install --no-save --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null
          node scripts/test-world-browser.cjs
      - name: Check deployed preview assets
        if: ${{ inputs.check_site }}
        run: |
          base=https://eternal-idle-v198-test.h936969423.workers.dev
          for path in /assets/client-walk/v1/mage_m/h2_0.webp /assets/client-walk/v1/knight_f/d2_0.webp /assets/client-walk/v1/mage_m/a6_0.webp /assets/client-walk/v1/darkelf_player/i6_0.webp /assets/client-world/v1/talking_island/manifest.json /assets/client-world/v1/zone_13/manifest.json /assets/client-world/v1/zone_06/manifest.json /assets/client-walk/v1/royal_m/2_0.webp /assets/client-walk/v1/m2773_172x246/sheet.webp /assets/client-walk/v1/knight_2hsword/2_0.webp /assets/client-walk/v1/darkelf_player/6_3.webp /assets/client-map-preview/v1/giran/manifest.json /assets/client-map-preview/v1/giran/4_2.webp /assets/client-map-preview/v1/talking/manifest.json /assets/client-map-preview/v1/gludio/manifest.json; do
            code=$(curl -sS -o /tmp/body -w '%{http_code} %{content_type} %{size_download}' "$base$path"); echo "$path $code"; [ "${code%% *}" = 200 ] || exit 1
          done
          curl -sS -o /dev/null -w 'page %{http_code}\n' "$base/map-preview"
          echo "SITE-CHECK-OK"
      - uses: actions/checkout@v4
        if: ${{ !inputs.check_site }}
        with:
          persist-credentials: false
      - name: Restore sprite probe output
        if: ${{ !inputs.check_site && inputs.render_walk }}
        id: sprite_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sprite-probe
          key: client-player-sprites-v2
      - name: Restore all monster sprite files
        if: ${{ !inputs.check_site && inputs.scan_monsters }}
        id: all_sprites
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/all-spr
          key: client-all-sprites-v1
      - name: Fetch map source from private R2
        if: ${{ !inputs.check_site && inputs.render_world }}
        working-directory: ${{ runner.temp }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint=https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com
          aws --endpoint-url "$endpoint" s3 cp s3://eternal-idle-v198-test-assets/client-map-source/v1/manifest.json manifest.json --no-progress --only-show-errors
          sha="$(python3 -c "import json;print(json.load(open('manifest.json'))['sha256'])")"
          aws --endpoint-url "$endpoint" s3 cp "s3://eternal-idle-v198-test-assets/client-map-source/v1/$sha.tar" source.tar --no-progress --only-show-errors
          echo "$sha  source.tar" | sha256sum -c -
          mkdir -p world-source && tar -xf source.tar -C world-source && rm source.tar
      - name: Fetch saved player sprites from private R2
        id: player_spr
        if: ${{ !inputs.check_site && inputs.render_attack }}
        working-directory: ${{ runner.temp }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 cp s3://eternal-idle-v198-test-assets/client-player-spr/v1/spr.tar spr.tar --no-progress --only-show-errors; then
            mkdir -p sprite-probe && tar -xf spr.tar -C sprite-probe
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate input and free runner disk
        if: ${{ !inputs.check_site }}
        run: |
          [[ "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]{20,80}$ ]] || { echo "::error::Invalid Drive file id"; exit 1; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h "$RUNNER_TEMP"
      - name: Install extraction tools
        if: ${{ !inputs.check_site }}
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar
          python3 -m pip install --quiet --break-system-packages 'gdown==5.2.0'
      - name: Restore extracted map source
        if: ${{ !inputs.check_site }}
        id: source_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/source
          key: client-map-source-96877a41-v1
      - name: Download archive
        if: ${{ !inputs.check_site && ((inputs.render_attack && steps.player_spr.outputs.hit != 'true') || (inputs.scan_monsters && steps.all_sprites.outputs.cache-hit != 'true') || (!inputs.scan_monsters && ((inputs.sprite_probe || inputs.render_walk) && steps.sprite_cache.outputs.cache-hit != 'true')) || (!inputs.render_attack && !inputs.render_world && !inputs.scan_monsters && !inputs.sprite_probe && !inputs.render_walk && steps.source_cache.outputs.cache-hit != 'true')) }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m gdown --id "$DRIVE_FILE_ID" -O client.rar
          ls -l client.rar
          sha256sum client.rar
      - name: List archive contents
        if: ${{ !inputs.check_site && !inputs.render_attack && !inputs.render_world && !inputs.render_walk && !inputs.scan_monsters && steps.source_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p report
          unrar l -c- client.rar > report/archive-list.txt
          sha256sum client.rar > report/archive-sha256.txt
          tail -n 3 report/archive-list.txt
          python3 - <<'PY'
          import collections,re
          ext=collections.Counter();size=collections.Counter();folders=collections.Counter()
          for line in open('report/archive-list.txt',errors='replace'):
              m=re.match(r'\s*[.A-Za-z*]{7,}\s+(\d+)\s+\S+\s+\S+\s+(.+)$',line)
              if not m: continue
              name=m[2].strip().replace('\\','/');e=name.rsplit('.',1)[-1].lower() if '.' in name.rsplit('/',1)[-1] else '(none)'
              ext[e]+=1;size[e]+=int(m[1]);folders[name.split('/')[1] if name.count('/')>1 else name.split('/')[0]]+=1
          with open('report/summary.txt','w') as f:
              f.write('By extension\n')
              for e,n in size.most_common(40):f.write(f'{e}\t{ext[e]} files\t{n/1e6:.1f} MB\n')
              f.write('\nBy top folder\n')
              for e,n in folders.most_common(40):f.write(f'{e}\t{n} files\n')
          print(open('report/summary.txt').read())
          PY
      - name: Print index and data file names
        if: ${{ !inputs.check_site && !inputs.render_attack && !inputs.render_world && !inputs.render_walk && !inputs.scan_monsters && steps.source_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          unrar lb -c- client.rar > names.txt
          grep -iE '\.(pak|idx)$' names.txt || true
          grep -iE '(^|[\\/])map[\\/]' names.txt | grep -iE '\.map$' | head -5 || true
      - name: Parse map data without executing client files
        if: ${{ !inputs.check_site && (inputs.parse_maps) }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p parsed
          set -f
          unrar x -o+ -inul '-n*.idx' '-n*.s32' '-n*.seg' '-n*.map' client.rar parsed/ || [ $? -eq 10 ]
          set +f
          python3 "$GITHUB_WORKSPACE/scripts/assets/parse-client-maps.py" parsed
      - name: Build map bundle and previews without credentials
        if: ${{ !inputs.check_site && (inputs.build_bundle) }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          if [ ! -d source ]; then
            set -f
            unrar x -o+ -inul '-n*/Tile.idx' '-n*/Tile.pak' '-n*.s32' '-n*.seg' client.rar source/ || [ $? -eq 10 ]
            set +f
          fi
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/snowwayne1231/l1j-tw-elf-lineage-serversite l1j
          git -C l1j checkout -q HEAD -- l1jserver/maps/0.txt l1jserver/maps/4.txt
          client_dir="$(dirname "$(find source -maxdepth 3 -name Tile.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/build-client-map-bundle.py" "$client_dir" l1j/l1jserver/maps bundle
          ls -l bundle
      - name: Upload bundle to private R2
        if: ${{ !inputs.check_site && (inputs.build_bundle && inputs.upload_r2) }}
        working-directory: ${{ runner.temp }}/bundle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          sha="$(python3 -c "import json;print(json.load(open('manifest.json'))['sha256'])")"
          endpoint=https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com
          aws --endpoint-url "$endpoint" s3 cp client-map-source.tar "s3://eternal-idle-v198-test-assets/client-map-source/v1/$sha.tar" --no-progress --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp manifest.json s3://eternal-idle-v198-test-assets/client-map-source/v1/manifest.json --no-progress --only-show-errors
          aws --endpoint-url "$endpoint" s3api head-object --bucket eternal-idle-v198-test-assets --key "client-map-source/v1/$sha.tar" --query ContentLength
      - name: Render preview regions without credentials
        if: ${{ !inputs.check_site && (inputs.render_preview) }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          client_dir="$(dirname "$(find source -maxdepth 3 -name Tile.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-map-preview.py" "$client_dir" preview
      - name: Upload preview regions to private R2
        if: ${{ !inputs.check_site && (inputs.render_preview) }}
        working-directory: ${{ runner.temp }}/preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-map-preview/v1/ --no-progress --only-show-errors
      - name: Probe player sprites without credentials
        if: ${{ !inputs.check_site && (inputs.sprite_probe || inputs.render_walk) && steps.sprite_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          rm -rf spr-source
          set -f
          unrar x -o+ -inul '-n*/Sprite*.idx' '-n*/Sprite*.pak' client.rar spr-source/ || [ $? -eq 10 ]
          set +f
          client_dir="$(dirname "$(find spr-source -maxdepth 3 -name Sprite.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/probe-client-sprites.py" "$client_dir" sprite-probe
          rm -rf spr-source client.rar
      - name: Save sprite probe output
        if: ${{ !inputs.check_site && inputs.render_walk && steps.sprite_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sprite-probe
          key: client-player-sprites-v2
      - name: Restore existing idle sprites from private R2
        if: ${{ !inputs.check_site && inputs.render_walk }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python3 scripts/restore-r2-bundles.py
          for base in royal_m royal_f; do
            mkdir -p "public/assets/sunrise-skills/$base/idle"
            curl -fsS -A eternal-idle-asset-check -o "public/assets/sunrise-skills/$base/idle/0.png" "https://eternal-idle-v198-test.h936969423.workers.dev/assets/sunrise-skills/$base/idle/0.png"
          done
      - name: Render walk frames without credentials
        if: ${{ !inputs.check_site && inputs.render_walk }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-walk.py" sprite-probe/spr "$GITHUB_WORKSPACE/public/assets/sprites" walk-out
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-monsters.py" sprite-probe/spr https://eternal-idle-v198-test.h936969423.workers.dev walk-out
      - name: Upload walk frames to private R2
        if: ${{ !inputs.check_site && inputs.render_walk }}
        working-directory: ${{ runner.temp }}/walk-out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-walk/v1/ --no-progress --only-show-errors
      - name: Extract all monster sprite files without credentials
        if: ${{ !inputs.check_site && inputs.scan_monsters && steps.all_sprites.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -f
          unrar x -o+ -inul '-n*/Sprite*.idx' '-n*/Sprite*.pak' client.rar spr-source/ || [ $? -eq 10 ]
          set +f
          client_dir="$(dirname "$(find spr-source -maxdepth 3 -name Sprite.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/extract-client-monster-sprites.py" "$client_dir" all-spr
          rm -rf spr-source client.rar
      - name: Save all monster sprite files
        if: ${{ !inputs.check_site && inputs.scan_monsters && steps.all_sprites.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/all-spr
          key: client-all-sprites-v1
      - name: Match monsters by image without credentials
        if: ${{ !inputs.check_site && inputs.scan_monsters }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0' 'numpy==2.3.3'
          python3 "$GITHUB_WORKSPACE/scripts/assets/match-client-monsters.py" all-spr https://eternal-idle-v198-test.h936969423.workers.dev scan-out
      - name: Upload matched walk sheets to private R2
        if: ${{ !inputs.check_site && inputs.scan_monsters }}
        working-directory: ${{ runner.temp }}/scan-out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-walk/v1/ --no-progress --only-show-errors
      - name: Render world zones without credentials
        if: ${{ !inputs.check_site && inputs.render_world }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-map-preview.py" world-source world-out "$GITHUB_WORKSPACE/lib/game/world-zones.json"
      - name: Upload world zones to private R2
        if: ${{ !inputs.check_site && inputs.render_world }}
        working-directory: ${{ runner.temp }}/world-out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-world/v1/ --no-progress --only-show-errors
      - name: Extract player sprites without credentials
        if: ${{ !inputs.check_site && inputs.render_attack && steps.player_spr.outputs.hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          set -f
          unrar x -o+ -inul '-n*/Sprite*.idx' '-n*/Sprite*.pak' client.rar spr-source/ || [ $? -eq 10 ]
          set +f
          client_dir="$(dirname "$(find spr-source -maxdepth 3 -name Sprite.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/probe-client-sprites.py" "$client_dir" sprite-probe > /dev/null
          rm -rf spr-source client.rar
          tar -cf spr.tar -C sprite-probe spr
      - name: Save player sprites to private R2
        if: ${{ !inputs.check_site && inputs.render_attack && steps.player_spr.outputs.hit != 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 cp spr.tar s3://eternal-idle-v198-test-assets/client-player-spr/v1/spr.tar --no-progress --only-show-errors
      - name: Restore existing attack sprites from private R2
        if: ${{ !inputs.check_site && inputs.render_attack }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python3 scripts/restore-r2-bundles.py
          for base in royal_m royal_f; do
            for kind in attack idle; do
              mkdir -p "public/assets/sunrise-skills/$base/$kind"
              curl -fsS -A eternal-idle-asset-check -o "public/assets/sunrise-skills/$base/$kind/0.png" "https://eternal-idle-v198-test.h936969423.workers.dev/assets/sunrise-skills/$base/$kind/0.png"
            done
          done
      - name: Render attacks without credentials
        if: ${{ !inputs.check_site && inputs.render_attack }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-attack.py" sprite-probe/spr "$GITHUB_WORKSPACE/public" attack-out
      - name: Upload attacks to private R2
        if: ${{ !inputs.check_site && inputs.render_attack }}
        working-directory: ${{ runner.temp }}/attack-out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-walk/v1/ --no-progress --only-show-errors
      - name: Upload report
        if: ${{ !inputs.check_site }}
        uses: actions/upload-artifact@v4
        with:
          name: client-map-report
          path: ${{ runner.temp }}/report
          retention-days: 3
      - name: Extract matching data files
        if: ${{ !inputs.check_site && (inputs.upload_extracted) }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p extracted
          read -r -a patterns <<< "$INCLUDE_PATTERNS"
          set -f
          args=(); for p in "${patterns[@]}"; do args+=("-n$p"); done
          unrar x -o+ -inul "${args[@]}" client.rar extracted/ || [ $? -eq 10 ]
          set +f
          find extracted -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.scr' \) -delete
          du -sh extracted
          find extracted -type f | wc -l
      - name: Upload extracted files
        if: ${{ !inputs.check_site && (inputs.upload_extracted) }}
        uses: actions/upload-artifact@v4
        with:
          name: client-map-data
          path: ${{ runner.temp }}/extracted
          retention-days: 3
          compression-level: 6
