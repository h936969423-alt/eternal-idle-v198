name: Inspect client map assets
# Data-only inspection. No secrets, read-only token. The archive is
# listed and matching data files are extracted; nothing inside it is executed.
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: Google Drive file id of the client archive
        required: true
        type: string
      include_patterns:
        description: Space-separated archive patterns to extract
        required: false
        default: '*.s32 *.seg *.til *.idx *.pak *.md map/* maps/* tile/* tiles/* Map/* Maps/* Tile/* Tiles/*'
        type: string
      upload_extracted:
        description: Upload extracted files as a 3-day artifact (off lists only)
        required: false
        default: false
        type: boolean
      parse_maps:
        description: Parse S32 and index files and print the result to the log
        required: false
        default: false
        type: boolean
      build_bundle:
        description: Build map data bundle and previews
        required: false
        default: false
        type: boolean
      upload_r2:
        description: Upload the verified bundle to isolated private R2
        required: false
        default: false
        type: boolean
      render_preview:
        description: Render preview regions and upload them to isolated private R2
        required: false
        default: false
        type: boolean
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
      INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate input and free runner disk
        run: |
          [[ "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]{20,80}$ ]] || { echo "::error::Invalid Drive file id"; exit 1; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h "$RUNNER_TEMP"
      - name: Install extraction tools
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar
          python3 -m pip install --quiet --break-system-packages 'gdown==5.2.0'
      - name: Restore extracted map source
        id: source_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/source
          key: client-map-source-96877a41-v1
      - name: Download archive
        if: ${{ steps.source_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m gdown --id "$DRIVE_FILE_ID" -O client.rar
          ls -l client.rar
          sha256sum client.rar
      - name: List archive contents
        if: ${{ steps.source_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p report
          unrar l -c- client.rar > report/archive-list.txt
          sha256sum client.rar > report/archive-sha256.txt
          tail -n 3 report/archive-list.txt
          python3 - <<'PY'
          import collections,re
          ext=collections.Counter();size=collections.Counter();folders=collections.Counter()
          for line in open('report/archive-list.txt',errors='replace'):
              m=re.match(r'\s*[.A-Za-z*]{7,}\s+(\d+)\s+\S+\s+\S+\s+(.+)$',line)
              if not m: continue
              name=m[2].strip().replace('\\','/');e=name.rsplit('.',1)[-1].lower() if '.' in name.rsplit('/',1)[-1] else '(none)'
              ext[e]+=1;size[e]+=int(m[1]);folders[name.split('/')[1] if name.count('/')>1 else name.split('/')[0]]+=1
          with open('report/summary.txt','w') as f:
              f.write('By extension\n')
              for e,n in size.most_common(40):f.write(f'{e}\t{ext[e]} files\t{n/1e6:.1f} MB\n')
              f.write('\nBy top folder\n')
              for e,n in folders.most_common(40):f.write(f'{e}\t{n} files\n')
          print(open('report/summary.txt').read())
          PY
      - name: Print index and data file names
        if: ${{ steps.source_cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          unrar lb -c- client.rar > names.txt
          grep -iE '\.(pak|idx)$' names.txt || true
          grep -iE '(^|[\\/])map[\\/]' names.txt | grep -iE '\.map$' | head -5 || true
      - name: Parse map data without executing client files
        if: ${{ inputs.parse_maps }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p parsed
          set -f
          unrar x -o+ -inul '-n*.idx' '-n*.s32' '-n*.seg' '-n*.map' client.rar parsed/ || [ $? -eq 10 ]
          set +f
          python3 "$GITHUB_WORKSPACE/scripts/assets/parse-client-maps.py" parsed
      - name: Build map bundle and previews without credentials
        if: ${{ inputs.build_bundle }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          if [ ! -d source ]; then
            set -f
            unrar x -o+ -inul '-n*/Tile.idx' '-n*/Tile.pak' '-n*.s32' '-n*.seg' client.rar source/ || [ $? -eq 10 ]
            set +f
          fi
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/snowwayne1231/l1j-tw-elf-lineage-serversite l1j
          git -C l1j checkout -q HEAD -- l1jserver/maps/0.txt l1jserver/maps/4.txt
          client_dir="$(dirname "$(find source -maxdepth 3 -name Tile.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/build-client-map-bundle.py" "$client_dir" l1j/l1jserver/maps bundle
          ls -l bundle
      - name: Upload bundle to private R2
        if: ${{ inputs.build_bundle && inputs.upload_r2 }}
        working-directory: ${{ runner.temp }}/bundle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          sha="$(python3 -c "import json;print(json.load(open('manifest.json'))['sha256'])")"
          endpoint=https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com
          aws --endpoint-url "$endpoint" s3 cp client-map-source.tar "s3://eternal-idle-v198-test-assets/client-map-source/v1/$sha.tar" --no-progress --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp manifest.json s3://eternal-idle-v198-test-assets/client-map-source/v1/manifest.json --no-progress --only-show-errors
          aws --endpoint-url "$endpoint" s3api head-object --bucket eternal-idle-v198-test-assets --key "client-map-source/v1/$sha.tar" --query ContentLength
      - name: Render preview regions without credentials
        if: ${{ inputs.render_preview }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pillow==11.3.0'
          client_dir="$(dirname "$(find source -maxdepth 3 -name Tile.idx | head -1)")"
          python3 "$GITHUB_WORKSPACE/scripts/assets/render-client-map-preview.py" "$client_dir" preview
      - name: Upload preview regions to private R2
        if: ${{ inputs.render_preview }}
        working-directory: ${{ runner.temp }}/preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws --endpoint-url https://9bf17726da5739f20d3e5ec454ae3d91.r2.cloudflarestorage.com s3 sync . s3://eternal-idle-v198-test-assets/client-map-preview/v1/ --no-progress --only-show-errors
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: client-map-report
          path: ${{ runner.temp }}/report
          retention-days: 3
      - name: Extract matching data files
        if: ${{ inputs.upload_extracted }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p extracted
          read -r -a patterns <<< "$INCLUDE_PATTERNS"
          set -f
          args=(); for p in "${patterns[@]}"; do args+=("-n$p"); done
          unrar x -o+ -inul "${args[@]}" client.rar extracted/ || [ $? -eq 10 ]
          set +f
          find extracted -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.scr' \) -delete
          du -sh extracted
          find extracted -type f | wc -l
      - name: Upload extracted files
        if: ${{ inputs.upload_extracted }}
        uses: actions/upload-artifact@v4
        with:
          name: client-map-data
          path: ${{ runner.temp }}/extracted
          retention-days: 3
          compression-level: 6
