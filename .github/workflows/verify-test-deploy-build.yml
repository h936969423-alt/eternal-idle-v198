name: Verify v198 test deployment build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_POLYMORPH_BUCKET: ${{ vars.PRIVATE_POLYMORPH_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore full v198 assets from private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/restore-r2-bundles.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify private polymorph routing and fallback
        run: node --test tests/lineage-global-polymorph.test.mjs
      - name: Verify complete production build without deploying
        run: pnpm run build
      - name: Validate worker and storage mappings
        run: python3 scripts/verify-test-worker-bindings.py
