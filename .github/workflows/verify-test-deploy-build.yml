name: Verify v198 test deployment build
on:
  workflow_dispatch:
  push:
    branches:
      - codex/v198-combat-regression-fixes-20261025
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full v198 assets from private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/restore-r2-bundles.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify combat, audio, types, save and offline regressions
        run: node scripts/verify-combat.mjs
      - name: Require all existing regression scripts to pass
        run: node scripts/verify-regressions.mjs
      - name: Verify complete production build without deploying
        run: pnpm run build
      - name: Validate worker and storage mappings
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('dist')
          assert (root/'server'/'wrangler.json').is_file(), 'missing generated Worker config'
          config=json.load(open(root/'server'/'wrangler.json'))
          assert any(x.get('binding')=='DB' and x.get('database_name')=='eternal-idle-v198-test-db' for x in config.get('d1_databases',[]))
          assert any(x.get('binding')=='BUCKET' and x.get('bucket_name')=='eternal-idle-v198-test-assets' for x in config.get('r2_buckets',[]))
          print('Verified test D1 and R2 bindings; no deployment performed')
          PY
