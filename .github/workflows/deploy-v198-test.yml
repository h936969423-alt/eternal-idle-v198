name: Deploy v198 isolated Cloudflare test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/game/**'
      - 'public/assets/four-dragons/**'
      - 'scripts/verify-four-dragon-assets.mjs'
      - 'app/four-dragon-sprite.tsx'
      - 'lib/asset-storage.ts'
      - 'app/combat-sprite.tsx'
      - 'app/use-sunrise-player-motion.ts'
      - 'app/combat-audio.ts'
      - 'app/monster-motion.tsx'
      - 'app/battle-arena.tsx'
      - 'app/scene-transition.tsx'
      - 'app/globals.css'
      - 'tests/**'
      - 'scripts/restore-sunrise-maps.py'
      - 'scripts/upload-sunrise-maps.py'
      - 'scripts/restore-lineagew-skills.py'
      - 'scripts/upload-lineagew-skills.py'
      - 'app/skill-book-grid.tsx'
      - 'app/reference-item-dialog.tsx'
      - 'app/active-status-bar.tsx'
      - 'app/game.tsx'
      - 'app/item-enhancement.tsx'
      - 'app/item-enhancement.css'
      - 'app/reference-item-dialog.tsx'
      - 'app/town-shops.tsx'
      - 'app/black-market.tsx'
      - 'app/black-market.css'
      - 'app/api/game/route.ts'
      - 'app/skill-cooldown-button.tsx'
      - 'app/skill-cooldown-button.css'
      - 'scripts/test-skill-cooldown.cjs'
      - 'scripts/test-stun-once.cjs'
      - 'scripts/test-skill-computation.cjs'
      - 'scripts/test-live-settlement.cjs'
      - 'scripts/test-live-http.py'
      - '.github/workflows/deploy-v198-test.yml'
permissions:
  contents: read
concurrency:
  group: eternal-idle-v198-test-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 9bf17726da5739f20d3e5ec454ae3d91
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; fi
      - name: Verify Cloudflare API token before expensive build
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -o /tmp/cloudflare-token-status.json || { echo "::error::Cloudflare did not accept the API token. Update CLOUDFLARE_API_TOKEN."; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/cloudflare-token-status.json'))
          if not data.get('success') or data.get('result',{}).get('status') != 'active':
              print('::error::Cloudflare API token is not active or was not accepted.')
              raise SystemExit(1)
          print('Cloudflare API token active; build can proceed.')
          PY
      - name: Restore game assets from isolated private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/restore-r2-bundles.py
      - name: Restore pinned Sunrise map backgrounds and verify all images
        run: python3 scripts/restore-sunrise-maps.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify combat animation and attack-phase regression tests before deploying
        run: node --experimental-strip-types --test tests/animation-clock.test.mjs tests/attack-phase.test.mjs tests/battle-layout.test.mjs
      - name: Verify alignment mechanics and save compatibility
        run: node scripts/test-alignment.cjs
      - name: Verify player motion against original Sunrise functions
        run: node scripts/test-sunrise-player-motion.cjs
      - name: Verify local 100ms attacks and 125ms player animation
        run: node --experimental-strip-types --test tests/player-facing.test.mjs tests/local-player-attack.test.mjs tests/local-hit-sync.test.mjs tests/player-target-lock.test.mjs tests/normal-attack-target.test.mjs tests/spell-presentation-sync.test.mjs
      - name: Verify audio activation and interruption recovery
        run: node --experimental-strip-types --test tests/combat-audio.test.mjs
      - name: Verify target spell renderer timing and cleanup
        run: |
          node scripts/test-magic-renderer.cjs
          node scripts/test-monster-drop-query.cjs
      - name: Verify batched network attack cadence
        run: node scripts/test-network-combat-cadence.cjs
      - name: Typecheck five-class skill integration
        run: pnpm exec tsc --noEmit
      - name: Verify five-class W skill mechanics and legacy save compatibility
        run: |
          python3 scripts/restore-lineagew-skills.py
          node scripts/test-lineagew-skills.cjs
          W_SKILL_REPORT=docs/lineagew-skill-verification.json node scripts/test-lineagew-complete.cjs
      - name: Verify shared Sunrise pet storage and lifecycle
        run: PET_REPORT=docs/sunrise-pet-verification.json node scripts/test-sunrise-pets.cjs
      - name: Verify failed-cast cooldown persistence and manual-auto lock
        run: |
          node scripts/test-skill-cooldown.cjs
          node scripts/test-auto-buff-selection.cjs
          node scripts/test-skill-id-migration.cjs
      - name: Verify one shock-stun motion and one confirmed impact
        run: node scripts/test-stun-once.cjs
      - name: Verify skill calculation equivalence and bounded Worker settlement
        run: node scripts/test-skill-computation.cjs
      - name: Verify continuous live polls do not reopen offline settlement
        run: |
          node scripts/test-live-settlement.cjs
          node scripts/test-offline-hunt.cjs
          node scripts/test-offline-catchup.cjs
          node scripts/test-offline-income.cjs
          node scripts/test-offline-income-notices.cjs
          node scripts/test-offline-loot.cjs
      - name: Verify merged Afei monster and world-boss drop tables
        run: node scripts/test-afei-drops.cjs
      - name: Verify Silver Knight NPC hub and real service transactions
        run: |
          node scripts/test-npc-hub.cjs
          node scripts/test-npc-hub-ui.cjs
          node scripts/test-npc-management.cjs
          node scripts/test-black-market.cjs
          node scripts/test-gilen-shop-ui.cjs
      - name: Verify blue-to-gold weapon growth and uncapped enhancement
        run: |
          node scripts/test-weapon-growth.cjs
          node scripts/test-enhancement-results.cjs
          node scripts/test-boss-drop-preview.cjs
          node scripts/test-four-dragon-loot.cjs
          node scripts/test-lineagew-mythic-enhancement.cjs
      - name: Verify self-contained four-dragon source material
        run: |
          node scripts/test-four-dragon-storage.cjs
          node scripts/verify-four-dragon-assets.mjs
      - name: Build complete Cloudflare Worker
        run: pnpm run build
      - name: Verify four-dragon atlases in final deployment output
        run: node scripts/verify-four-dragon-assets.mjs --built
      - name: Publish verified W skill icons to isolated R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/upload-lineagew-skills.py
      - name: Verify map routing and all backgrounds in final deployment
        run: CHECK_BUILT_MAPS=1 node --test tests/sunrise-maps.test.mjs tests/sunrise-map-storage.test.mjs
      - name: Publish verified maps to isolated R2 before deploying their routes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/upload-sunrise-maps.py
      - name: Assert strict isolation from live resources
        run: |
          python3 - <<'PY'
          import json
          p='dist/server/wrangler.json'
          c=json.load(open(p))
          db=c.get('d1_databases',[])
          r2=c.get('r2_buckets',[])
          assert len(db)==1 and db[0].get('binding')=='DB'
          assert db[0].get('database_id')=='827dd8d1-53b2-460c-9594-2435db824432'
          assert db[0].get('database_name')=='eternal-idle-v198-test-db'
          assert len(r2)==1 and r2[0].get('binding')=='BUCKET'
          assert r2[0].get('bucket_name')=='eternal-idle-v198-test-assets'
          print('Isolated test D1 and R2 bindings checked; production not modified')
          PY
      - name: Retire legacy offline cron before activating login settlement
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.offline-test.json'))
          assert c['name']=='eternal-idle-v198-offline-test'
          assert c['triggers']['crons']==[], 'Offline cron must remain disabled'
          d=c['d1_databases']
          assert len(d)==1 and d[0]['binding']=='DB'
          assert d[0]['database_id']=='827dd8d1-53b2-460c-9594-2435db824432'
          assert d[0]['database_name']=='eternal-idle-v198-test-db'
          PY
          pnpm exec wrangler deploy --config wrangler.offline-test.json
      - name: Deploy named test-only Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name eternal-idle-v198-test --keep-vars
      - name: Verify real test-account login and continuous live polls
        run: python3 scripts/test-live-http.py
      - name: Verify every deployed four-dragon atlas against source hash
        env:
          DRAGON_ASSET_ORIGIN: https://eternal-idle-v198-test.h936969423.workers.dev
        run: node scripts/verify-four-dragon-assets.mjs --live
      - name: Print deployment location
        run: echo 'Check Cloudflare Workers dashboard for eternal-idle-v198-test workers.dev URL'







