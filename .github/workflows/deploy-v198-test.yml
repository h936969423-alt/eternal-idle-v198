name: Deploy v198 isolated Cloudflare test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-idle-v198-test-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 9bf17726da5739f20d3e5ec454ae3d91
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; fi
      - name: Restore game assets from isolated private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 scripts/restore-r2-bundles.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build complete Cloudflare Worker
        run: pnpm run build
      - name: Assert strict isolation from live resources
        run: |
          python3 - <<'PY'
          import json
          p='dist/server/wrangler.json'
          c=json.load(open(p))
          db=c.get('d1_databases',[])
          r2=c.get('r2_buckets',[])
          assert len(db)==1 and db[0].get('binding')=='DB'
          assert db[0].get('database_id')=='827dd8d1-53b2-460c-9594-2435db824432'
          assert db[0].get('database_name')=='eternal-idle-v198-test-db'
          assert len(r2)==1 and r2[0].get('binding')=='BUCKET'
          assert r2[0].get('bucket_name')=='eternal-idle-v198-test-assets'
          print('Isolated test D1 and R2 bindings checked; production not modified')
          PY
      - name: Deploy named test-only Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name eternal-idle-v198-test
      - name: Print deployment location
        run: echo 'Check Cloudflare Workers dashboard for eternal-idle-v198-test workers.dev URL'
