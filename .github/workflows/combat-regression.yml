name: Combat regression checks
on:
  push:
    branches: [main]
    paths:
      - 'lib/game/engine.ts'
      - 'lib/game/combat-clock.ts'
      - 'lib/game/animation-clock.ts'
      - 'lib/game/sunrise-player-motion.ts'
      - 'lib/game/sunrise-player-cues.ts'
      - 'lib/game/combat-presentation.ts'
      - 'app/use-sunrise-player-motion.ts'
      - 'app/combat-sprite.tsx'
      - 'app/monster-motion.tsx'
      - 'app/scene-transition.tsx'
      - 'app/globals.css'
      - 'tests/**'
      - '.github/workflows/combat-regression.yml'
  pull_request:
    paths:
      - 'lib/game/**'
      - 'app/use-sunrise-player-motion.ts'
      - 'app/combat-sprite.tsx'
      - 'app/monster-motion.tsx'
      - 'app/scene-transition.tsx'
      - 'app/globals.css'
      - 'tests/**'
      - '.github/workflows/combat-regression.yml'
permissions:
  contents: read
jobs:
  combat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run combat timing regressions
        run: node --experimental-strip-types --test tests/animation-clock.test.mjs tests/attack-phase.test.mjs tests/battle-layout.test.mjs tests/local-player-attack.test.mjs tests/local-hit-sync.test.mjs tests/player-target-lock.test.mjs tests/normal-attack-target.test.mjs tests/spell-presentation-sync.test.mjs tests/spell-impact-timing.test.mjs
      - name: Verify TypeScript type safety
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          node scripts/test-alignment.cjs
          node scripts/test-sunrise-player-motion.cjs
          node scripts/test-network-combat-cadence.cjs
          pnpm exec tsc --noEmit
          node scripts/test-weapon-growth.cjs
          node scripts/test-boss-drop-preview.cjs
          node scripts/test-four-dragon-loot.cjs
          node scripts/test-lineagew-mythic-enhancement.cjs
          node scripts/test-map-layout.cjs

